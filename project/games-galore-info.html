    <link rel="stylesheet" href="styles/games-galore.css">
    <link rel="stylesheet" href="styles/games-galore-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header>
        <img src="images/games-galore-logo.webp" alt="game galore logo">
        <button id="menu" aria-label="Navigation"></button>
        <nav class="navigation">
            <ul>
                <li><a href="games-galore-home.html">Home</a></li>
                <li><a href="games-galore-board-game.html">Board Games</a></li>

    <main>
        <div>
            <a href="https://www.amazon.com/">Amazon</a>
            <a href="https://boardgamegeek.com/">Board Game Geek</a>
        </div>
        <form method="get" action="">
            <legend>Complaint/Suggestion Form</legend>
            <label>Email*<input type="email" name="email" placeholder="someone@gmail.com" required></label>
            <label>Type of Feedback*</label>
            <label><input type="radio" name="type" value="bugs" required>Bugs with site</label>
            <label><input type="radio" name="type" value="information" required>Incorrect Information Displayed</label>
            <label><input type="radio" name="type" value="suggestion" required>Suggestion</label>
            <label>Feedback*<textarea name="feedback" rows="6" cols="50" placeholder="Type your issue/complaint here..." required></textarea></label>
            <input type="submit" value="Give Feedback">
        </form>
    </main>
    <footer>
        <p>
            &copy;
            <span id="currentYear"></span>
            Cale Bodily, UT
        </p>
