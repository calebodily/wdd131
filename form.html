<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="A page form to submit feedback for product review for different products">
    <meta name="author" content="Cale Bodily">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <p>Product Review</p>
    </header>
    <main>
        <form method="get" action="review.html">
            <div>
                <label>Product Name
                    <select name="product" id="product" required>
                        <option value="selectproduct" disabled selected>Select a Product ...</option>
                    </select>
                </label>
            </div>
            <div>
                <label>Overall Rating
                    <div class="stars">
                        <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                        <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                        <input type="radio" id="threestar" name="stars" value="3" required><label
                            for="threestar"></label>
                        <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                        <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
                    </div>
                </label>
            </div>
            <div>
                <label>Date of Installation<input type="date" name="date" id="date" required></label>
            </div>
            <div>
                <label>Which features did you find useful in the product? (check all that apply)
                    <label><input type="checkbox" id="durability" name="durability"
                            value="durability">Durability</label>
                    <label><input type="checkbox" id="ease" name="ease" value="ease">Ease of Use</label>
                    <label><input type="checkbox" id="performance" name="performance"
                            value="performance">Performance</label>
                    <label><input type="checkbox" id="design" name="design" value="design">Design</label>
                </label>
            </div>
            <div>
                <label>Written Review<textarea id="written" name="written" rows="6"></textarea></label>
            </div>
            <div class="fix">
                <label>Your Name<input type="text" id="name" name="name"></label>
            </div>
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>
            &copy;
            <span id="currentYear"></span>
            Cale Bodily, UT
        </p>
        <p>
            Last Modified:
            <span id="lastModified"></span>
        </p>
    </footer>
</body>

</html>
